[package]
name = "kdbx2pasa"
version = "0.4.14"
edition = "2024"
license = "GPL-3.0-or-later"
description = "KeePass to pasa and back: kdbx2pasa | pasa load; pasa dump | pasa2kdbx"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false }
keepass = { version = "0.17", features = ["serialization", "save_kdbx4"] }
# pasa's own reading of an entry, for the export (no network, no window).
pasa = { path = "..", default-features = false }
serde_json = "1"
rpassword = "7"
tar = { version = "0.4", default-features = false }
uuid = "1"

