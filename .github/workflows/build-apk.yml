name: Build

# Tests on Linux and macOS; the APK on Linux. The debug APK artifact is for
# testing only (the runner's throwaway debug key). A version tag (v*), or a
# run by hand naming one (the release then makes the tag), builds
# an unsigned release APK with no secrets in reach, then a separate job that
# runs no build code signs it with apksigner and publishes it with its
# SHA-256.
#
# Supply chain: third-party actions pinned to commit SHAs, the Rust toolchain
# to a version, Cargo to the committed lockfile (checked against RustSec),
# the Gradle wrapper validated and its distribution pinned by SHA-256,
# read-only token, no persisted git credentials.
#
# Caches (third-party crates, compiled; Gradle's downloads and task outputs)
# are saved by runs on main alone and read by every run: a pull request
# cannot write what a release reads.

# A release tag, once per pull request (Markdown alone runs nothing), or by
# hand: not again on every merge. Minutes are scarce.
on:
  push:
    tags: ["v*"]
  pull_request: { paths-ignore: ["**.md"] }
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag vX.Y.Z (empty: build only)"
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The release's tag: pushed, or named by hand. Empty: no release.
  TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || '') }}
  NDK_VERSION: "30.0.16248370"
  RUST_VERSION: "1.97.0"
  MAIN: ${{ github.ref == 'refs/heads/main' }}

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env: { CARGO_INCREMENTAL: 0, CARGO_PROFILE_DEV_DEBUG: line-tables-only }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { save-if: "${{ env.MAIN }}" }
      - name: libudev, pcsc-lite (security keys over USB, NFC readers)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -yq libudev-dev libpcsclite-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --features gui -- -D warnings
      - run: cargo test --locked --workspace
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        if: runner.os == 'Linux'
        with: { tool: cargo-audit@0.22.2 }
      - name: Known vulnerabilities (RustSec advisory database)
        if: runner.os == 'Linux'
        run: cargo audit

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { submodules: true, persist-credentials: false }
      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android,x86_64-linux-android
          components: clippy

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # The default also installs the legacy `tools` package, which the
          # SDK repository no longer provides (sdkmanager exits 1).
          packages: platform-tools

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { save-if: "${{ env.MAIN }}" }
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: gradle
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with: { tool: cargo-ndk@4.1.2 }

      - name: Lint the JNI bridge
        run: cargo clippy --locked -p apasa-jni -- -D warnings

      - name: The tag is the version
        if: env.TAG != ''
        run: |
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -qx "version = \"${TAG#v}\"" Cargo.toml
          grep -q "versionName = \"${TAG#v}\"" android/app/build.gradle.kts

      # Not for a release: the native library as an earlier run built it
      # from these very Rust sources, so a change to the Kotlin alone
      # compiles no Rust.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: so
        if: env.TAG == ''
        with:
          path: android/app/src/main/jniLibs
          key: so-${{ env.NDK_VERSION }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'src/**', 'apasa-jni/**', '.cargo/**', 'android/app/build.gradle.kts') }}

      # A release: both APKs, both ABIs, optimised as a whole. Otherwise the
      # debug APK alone, for phones, quickly (-Ppasa.fast).
      - name: Build the APKs
        working-directory: android
        env:
          PASA_SO: ${{ steps.so.outputs.cache-hit == 'true' && 'cached' || '' }}
        run: |
          if [ -n "$TAG" ]; then
            ./gradlew --no-daemon assembleDebug assembleRelease
          else
            ./gradlew --no-daemon assembleDebug -Ppasa.fast=true
          fi

      # What talks to a hardware key (CTAP2, slot 2) opens no connection:
      # not the app's code for it, not Yubico's library as it was resolved.
      - name: The key code reaches no network
        run: sh android/no-network.sh

      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: env.MAIN == 'true' && steps.gradle.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apasa-debug-apk-TESTING-ONLY
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: env.TAG != ''
        with:
          name: apasa-release-unsigned
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  # For a release: the desktop binary (cli, tui and gui in one).
  desktop:
    if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, name: x86_64-linux }
          - { os: macos-latest, name: aarch64-macos }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with: { toolchain: "${{ env.RUST_VERSION }}" }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { save-if: "${{ env.MAIN }}" }
      - name: libudev, pcsc-lite (security keys over USB, NFC readers)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -yq libudev-dev libpcsclite-dev
      - run: cargo build --locked --release --features gui
      - name: Pack
        env: { NAME: "${{ matrix.name }}" }
        run: |
          d="pasa-$TAG-$NAME"; mkdir "$d"
          cp README.md COPYING "$d"
          case $NAME in
            *macos) contrib/macos-app.sh target/release/pasa "$d" "${TAG#v}" ;;
            *) cp target/release/pasa "$d" ;;
          esac
          tar czf "$d.tar.gz" "$d"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pasa-${{ matrix.name }}
          path: pasa-*.tar.gz
          if-no-files-found: error

  release:
    if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/v')
    needs: [test, apk, desktop]
    runs-on: ubuntu-latest
    # The signing secrets live in this environment, used only after a
    # required reviewer approves.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: apasa-release-unsigned }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { pattern: pasa-*, merge-multiple: true }
      - run: for f in pasa-*.tar.gz; do sha256sum "$f" > "$f.sha256"; done
      - name: Sign
        env:
          KEYSTORE_B64: ${{ secrets.APASA_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.APASA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.APASA_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.APASA_KEY_PASSWORD }}
        run: |
          [ -n "$KEYSTORE_B64" ] || { echo "::error::signing secrets are not set"; exit 1; }
          ks="$RUNNER_TEMP/release.jks"; trap 'rm -f "$ks"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$ks"
          signer=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          out="apasa-${TAG}.apk"
          "$signer" sign --ks "$ks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
            --out "$out" app-release-unsigned.apk
          "$signer" verify "$out"
          sha256sum "$out" > "$out.sha256"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            apasa-*.apk
            apasa-*.apk.sha256
            pasa-*.tar.gz
            pasa-*.tar.gz.sha256
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
