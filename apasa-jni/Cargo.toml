[package]
name = "apasa-jni"
version = "0.5.0"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
name = "apasa"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
jni = "0.22"
pasa = { path = "..", default-features = false, features = ["sync"] }
# org.pushir.Native, for the shared push connection (android/pushir).
pushir = { git = "https://github.com/cablab-ucf/pushir", rev = "70d19ba365d265ad7782a590ac916a32580fa5fa", features = ["jni"] }
zeroize = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
