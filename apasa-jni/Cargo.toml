[package]
name = "apasa-jni"
version = "0.4.16"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
name = "apasa"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
jni = "0.22"
pasa = { path = "..", default-features = false, features = ["sync"] }
# org.pushir.Native, for the shared push connection (android/pushir).
pushir = { git = "https://github.com/cablab-ucf/pushir", rev = "04c89d01832e73df15c16977272ca0aaf1d3ef23", features = ["jni"] }
zeroize = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
