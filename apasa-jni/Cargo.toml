[package]
name = "apasa-jni"
version = "0.4.0"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
name = "apasa"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
jni = "0.22"
pasa = { path = ".." }
# org.pushir.Native, for the shared push connection (android/pushir).
pushir = { git = "https://github.com/cablab-ucf/pushir", rev = "5d02db72e41c6646de1d60600a71a7d1b82f44cd", features = ["jni"] }
zeroize = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
