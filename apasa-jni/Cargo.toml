[package]
name = "apasa-jni"
version = "0.4.17"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
name = "apasa"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
jni = "0.22"
pasa = { path = "..", default-features = false, features = ["sync"] }
# org.pushir.Native, for the shared push connection (android/pushir).
pushir = { git = "https://github.com/cablab-ucf/pushir", rev = "5c1681ba1440387039e07cf8c1d0450b32897701", features = ["jni"] }
zeroize = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
