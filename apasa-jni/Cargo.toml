[package]
name = "apasa-jni"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
name = "apasa"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
jni = "0.22"
pasa = { path = ".." }
# org.irpush.Native, for the shared push connection (android/irpush).
irpush = { git = "https://github.com/cab-ucf/irpush", rev = "551e860311d551eb73faaaf8a21abdbe1fa57fea", features = ["jni"] }
zeroize = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
