[package]
name = "pasa"
version = "0.4.11"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.97"
description = "A tiny password store: sealed versions, synced by union"

[workspace]
members = ["kdbx2pasa", "apasa-jni"]

[features]
default = ["sync", "tui"]
sync = ["dep:irnet", "dep:pairir", "dep:pushir", "dep:iroh", "dep:tokio", "dep:qrcode", "dep:landlock"]
tui = ["dep:crossterm"]
gui = ["dep:eframe", "dep:winit", "sync"]

[dependencies]
anyhow = "1"
argon2 = { version = "0.6", features = ["zeroize"] }
age = "0.11"
age-core = "0.11"
getrandom = "0.4"
humantime = "2"
rpassword = "7"
sha1 = "0.10"
sha2 = "0.11"
tar = { version = "0.4", default-features = false }
totp-lite = "2"
data-encoding = "2"
zeroize = "1"
irnet = { git = "https://github.com/cablab-ucf/irnet", rev = "7a19e4aeac4b56365626feea68cddd17496a18dc", optional = true }
pushir = { git = "https://github.com/cablab-ucf/pushir", rev = "3e91f07d51eb6b08cd807640b4edc10cde16b716", optional = true }
pairir = { git = "https://github.com/cablab-ucf/pairir", rev = "6e7faa92e6732834db30e8a67fc439f5cb333132", optional = true }
iroh = { version = "1.4", default-features = false, optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"], optional = true }
qrcode = { version = "0.14", default-features = false, optional = true }
crossterm = { version = "0.29.0", default-features = false, features = ["events"], optional = true }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"], optional = true }
# The frame (close, minimise, maximise) that GNOME on Wayland leaves to the app.
winit = { version = "0.30", default-features = false, features = ["wayland-csd-adwaita-notitle"], optional = true }

# The network side confines itself to v/ and net/.
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
landlock = { version = "0.4", optional = true }

[profile.release]
lto = true
codegen-units = 1
strip = true
