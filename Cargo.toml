[package]
name = "pasa"
version = "0.3.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.97"
description = "A tiny password store: sealed versions, synced by union"

[workspace]
members = ["kdbx2pasa", "apasa-jni"]

[features]
default = ["sync"]
sync = ["dep:irnet", "dep:pairir", "dep:pushir", "dep:iroh", "dep:tokio", "dep:qrcode"]

[dependencies]
anyhow = "1"
argon2 = { version = "0.6", features = ["zeroize"] }
age = "0.11"
age-core = "0.11"
getrandom = "0.4"
humantime = "2"
rpassword = "7"
sha2 = "0.11"
tar = { version = "0.4", default-features = false }
totp-lite = "2"
data-encoding = "2"
zeroize = "1"
irnet = { git = "https://github.com/cablab-ucf/irnet", rev = "7a19e4aeac4b56365626feea68cddd17496a18dc", optional = true }
pushir = { git = "https://github.com/cablab-ucf/pushir", rev = "cf0dad19c1e67d6bcd9fcf90c467b45e9b9f2d51", optional = true }
pairir = { git = "https://github.com/cablab-ucf/pairir", rev = "43d6c130de74f60b6fc8d3310d18ae2bd8c2684c", optional = true }
iroh = { version = "1.4", default-features = false, optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"], optional = true }
qrcode = { version = "0.14", default-features = false, optional = true }

[profile.release]
lto = true
codegen-units = 1
strip = true
