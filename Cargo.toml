[package]
name = "pasa"
version = "0.4.13"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.97"
description = "A tiny password store: sealed versions, synced by union"

# The program needs its features; the library (Android's) does not.
[[bin]]
name = "pasa"
path = "src/main.rs"
required-features = ["fido"]

[workspace]
members = ["kdbx2pasa", "apasa-jni"]

[features]
default = ["sync", "tui", "scan", "fido"]
sync = ["dep:irnet", "dep:pairir", "dep:pushir", "dep:iroh", "dep:tokio", "dep:qrcode", "dep:landlock"]
# A QR code by the camera, or in a picture (desktop; Android scans with ZXing).
scan = ["sync", "dep:rqrr", "dep:rxing", "dep:nokhwa", "dep:image"]
# Security keys by CTAP2 over USB, in-process (desktop; Android: Yubico's kit).
fido = ["dep:authenticator", "dep:pcsc"]
tui = ["dep:crossterm"]
gui = ["dep:eframe", "dep:winit", "scan", "fido"]

[dependencies]
anyhow = "1"
argon2 = { version = "0.6", features = ["zeroize"] }
age = "0.11"
age-core = "0.11"
getrandom = "0.4"
humantime = "2"
rpassword = "7"
sha1 = "0.10"
sha2 = "0.11"
tar = { version = "0.4", default-features = false }
totp-lite = "2"
data-encoding = "2"
zeroize = "1"
irnet = { git = "https://github.com/cablab-ucf/irnet", rev = "7a19e4aeac4b56365626feea68cddd17496a18dc", optional = true }
pushir = { git = "https://github.com/cablab-ucf/pushir", rev = "3e91f07d51eb6b08cd807640b4edc10cde16b716", optional = true }
pairir = { git = "https://github.com/cablab-ucf/pairir", rev = "6e7faa92e6732834db30e8a67fc439f5cb333132", optional = true }
iroh = { version = "1.4", default-features = false, optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"], optional = true }
qrcode = { version = "0.14", default-features = false, optional = true }
# Read a pairing QR code in camera frames (pure Rust): each reads frames
# the other misses.
rqrr = { version = "0.11", optional = true }
rxing = { version = "0.9", default-features = false, features = ["decoders", "qrcode", "encoding_rs"], optional = true }
# The camera, in this process: AVFoundation (macOS), V4L2 (Linux). Its own
# MJPEG decoder (C) left out: `image` (Rust) reads JPEG and PNG.
nokhwa = { version = "0.10", default-features = false, features = ["input-native"], optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"], optional = true }
# CTAP2 to security keys over USB HID: Firefox's own, with RustCrypto. No
# tool to install, no keyboard access (macOS asks no Input Monitoring).
authenticator = { version = "0.5", default-features = false, features = ["crypto_rust"], optional = true }
# Smart cards: a YubiKey held to an NFC reader (or its CCID side, plugged
# in), through the system's PC/SC (pcsc-lite; macOS's own).
pcsc = { version = "2.9", optional = true }
crossterm = { version = "0.29.0", default-features = false, features = ["events"], optional = true }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"], optional = true }
# The frame (close, minimise, maximise) that GNOME on Wayland leaves to the app.
winit = { version = "0.30", default-features = false, features = ["wayland-csd-adwaita-notitle"], optional = true }

# The network side confines itself to v/ and net/.
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
landlock = { version = "0.4", optional = true }

[profile.release]
lto = true
codegen-units = 1
strip = true
